<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHA1 online</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --result-bg: #f1f5f9;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #sha1-title {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--success);
      background: #dcfce7;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .subtitle {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: var(--muted);
    }

    form p {
      margin: 0 0 14px 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input[type="submit"] {
      padding: 11px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    input[type="submit"]:hover {
      background: var(--accent-hover);
    }

    select {
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .algo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    #result-container {
      margin-top: 20px;
      padding: 20px;
      background: var(--result-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }

    #result-container.visible {
      display: block;
    }

    #result-container p {
      margin: 0;
      font-size: 18px;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.6;
    }

    #result-sha1 {
      display: inline-block;
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      user-select: all;
    }

    .result-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #f8fafc;
    }

    .footer-note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="sha1-title">
    <span class="badge">Ad-Free &amp; Bot-Ready</span>
    <h1>SHA1 and other hash functions online generator</h1>
    <p class="subtitle">100% client-side, offline-ready, compatible with sha1-online.com selectors.</p>

    <form action="/" method="post" name="sha-1-online-generator" id="hashForm">
      <p class="input-row">
        <input
          type="text"
          name="textToHash"
          id="textToHashId"
          size="40"
          placeholder="Enter text to hash..."
          aria-label="Text to hash"
          autocomplete="off"
        />
        <input type="submit" id="hashBtn" value="hash" aria-label="Hash" />
      </p>
      <p class="algo-row">
        <label for="hashAlgorithm">Algorithm:</label>
        <select name="hash-algorithm-used" id="hashAlgorithm" size="1">
          <option value="sha1" selected>sha-1</option>
          <option value="md5">md5</option>
          <option value="sha256">sha256</option>
          <option value="sha384">sha384</option>
          <option value="sha512">sha512</option>
          <option value="crc32">crc32</option>
          <option value="adler32">adler32</option>
        </select>
      </p>
    </form>

    <div id="result-container">
      <p>Result for <span id="result-algo">sha1</span>:&nbsp;&nbsp;<span id="result-sha1"></span></p>
      <div class="result-actions">
        <button type="button" class="btn-secondary" id="copyBtn">Copy Hash</button>
        <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="footer-note">
      Selectors: <code>#textToHashId</code> &bull; <code>input[type="submit"][value="hash"]</code> &bull; <code>select[name="hash-algorithm-used"]</code> &bull; <code>#result-sha1</code>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      function utf8Bytes(str) {
        return new TextEncoder().encode(str);
      }

      function toHex32(n) {
        return (n >>> 0).toString(16).padStart(8, "0");
      }

      function rotl32(x, n) {
        return ((x << n) | (x >>> (32 - n))) >>> 0;
      }

      function rotr32(x, n) {
        return ((x >>> n) | (x << (32 - n))) >>> 0;
      }

      // ---- SHA-1 ----
      function sha1(str) {
        const msg = utf8Bytes(str);
        const bitLen = msg.length * 8;
        const paddedLen = Math.ceil((msg.length + 9) / 64) * 64;
        const buf = new Uint8Array(paddedLen);
        buf.set(msg);
        buf[msg.length] = 0x80;
        const view = new DataView(buf.buffer);
        view.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
        view.setUint32(paddedLen - 4, bitLen >>> 0, false);

        let h0 = 0x67452301;
        let h1 = 0xefcdab89;
        let h2 = 0x98badcfe;
        let h3 = 0x10325476;
        let h4 = 0xc3d2e1f0;
        const w = new Uint32Array(80);

        for (let offset = 0; offset < paddedLen; offset += 64) {
          for (let i = 0; i < 16; i++) {
            w[i] = view.getUint32(offset + i * 4, false);
          }
          for (let i = 16; i < 80; i++) {
            w[i] = rotl32(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
          }

          let a = h0, b = h1, c = h2, d = h3, e = h4;
          for (let i = 0; i < 80; i++) {
            let f, k;
            if (i < 20) {
              f = (b & c) | (~b & d);
              k = 0x5a827999;
            } else if (i < 40) {
              f = b ^ c ^ d;
              k = 0x6ed9eba1;
            } else if (i < 60) {
              f = (b & c) | (b & d) | (c & d);
              k = 0x8f1bbcdc;
            } else {
              f = b ^ c ^ d;
              k = 0xca62c1d6;
            }
            const temp = (rotl32(a, 5) + f + e + k + w[i]) >>> 0;
            e = d;
            d = c;
            c = rotl32(b, 30);
            b = a;
            a = temp;
          }

          h0 = (h0 + a) >>> 0;
          h1 = (h1 + b) >>> 0;
          h2 = (h2 + c) >>> 0;
          h3 = (h3 + d) >>> 0;
          h4 = (h4 + e) >>> 0;
        }

        return toHex32(h0) + toHex32(h1) + toHex32(h2) + toHex32(h3) + toHex32(h4);
      }

      // ---- MD5 ----
      const MD5_S = [
        7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
        5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
        4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
        6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
      ];
      const MD5_K = new Uint32Array(64);
      for (let i = 0; i < 64; i++) {
        MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 0x100000000) >>> 0;
      }

      function toHexLE32(n) {
        let s = "";
        for (let i = 0; i < 4; i++) {
          s += ((n >>> (i * 8)) & 0xff).toString(16).padStart(2, "0");
        }
        return s;
      }

      function md5(str) {
        const msg = utf8Bytes(str);
        const bitLen = msg.length * 8;
        const paddedLen = Math.ceil((msg.length + 9) / 64) * 64;
        const buf = new Uint8Array(paddedLen);
        buf.set(msg);
        buf[msg.length] = 0x80;
        const view = new DataView(buf.buffer);
        view.setUint32(paddedLen - 8, bitLen >>> 0, true);
        view.setUint32(paddedLen - 4, Math.floor(bitLen / 0x100000000), true);

        let a0 = 0x67452301;
        let b0 = 0xefcdab89;
        let c0 = 0x98badcfe;
        let d0 = 0x10325476;
        const m = new Uint32Array(16);

        for (let offset = 0; offset < paddedLen; offset += 64) {
          for (let i = 0; i < 16; i++) {
            m[i] = view.getUint32(offset + i * 4, true);
          }

          let a = a0, b = b0, c = c0, d = d0;
          for (let i = 0; i < 64; i++) {
            let f, g;
            if (i < 16) {
              f = (b & c) | (~b & d);
              g = i;
            } else if (i < 32) {
              f = (d & b) | (~d & c);
              g = (5 * i + 1) % 16;
            } else if (i < 48) {
              f = b ^ c ^ d;
              g = (3 * i + 5) % 16;
            } else {
              f = c ^ (b | ~d);
              g = (7 * i) % 16;
            }
            const tmp = d;
            d = c;
            c = b;
            b = (b + rotl32((a + f + MD5_K[i] + m[g]) >>> 0, MD5_S[i])) >>> 0;
            a = tmp;
          }

          a0 = (a0 + a) >>> 0;
          b0 = (b0 + b) >>> 0;
          c0 = (c0 + c) >>> 0;
          d0 = (d0 + d) >>> 0;
        }

        return toHexLE32(a0) + toHexLE32(b0) + toHexLE32(c0) + toHexLE32(d0);
      }

      // ---- SHA-256 ----
      const SHA256_K = new Uint32Array([
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ]);

      function sha256(str) {
        const msg = utf8Bytes(str);
        const bitLen = msg.length * 8;
        const paddedLen = Math.ceil((msg.length + 9) / 64) * 64;
        const buf = new Uint8Array(paddedLen);
        buf.set(msg);
        buf[msg.length] = 0x80;
        const view = new DataView(buf.buffer);
        view.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
        view.setUint32(paddedLen - 4, bitLen >>> 0, false);

        const h = new Uint32Array([
          0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
          0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
        ]);
        const w = new Uint32Array(64);

        for (let offset = 0; offset < paddedLen; offset += 64) {
          for (let i = 0; i < 16; i++) {
            w[i] = view.getUint32(offset + i * 4, false);
          }
          for (let i = 16; i < 64; i++) {
            const s0 = rotr32(w[i - 15], 7) ^ rotr32(w[i - 15], 18) ^ (w[i - 15] >>> 3);
            const s1 = rotr32(w[i - 2], 17) ^ rotr32(w[i - 2], 19) ^ (w[i - 2] >>> 10);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
          }

          let [a, b, c, d, e, f, g, hh] = h;
          for (let i = 0; i < 64; i++) {
            const S1 = rotr32(e, 6) ^ rotr32(e, 11) ^ rotr32(e, 25);
            const ch = (e & f) ^ (~e & g);
            const temp1 = (hh + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
            const S0 = rotr32(a, 2) ^ rotr32(a, 13) ^ rotr32(a, 22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (S0 + maj) >>> 0;

            hh = g;
            g = f;
            f = e;
            e = (d + temp1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) >>> 0;
          }

          h[0] = (h[0] + a) >>> 0;
          h[1] = (h[1] + b) >>> 0;
          h[2] = (h[2] + c) >>> 0;
          h[3] = (h[3] + d) >>> 0;
          h[4] = (h[4] + e) >>> 0;
          h[5] = (h[5] + f) >>> 0;
          h[6] = (h[6] + g) >>> 0;
          h[7] = (h[7] + hh) >>> 0;
        }

        return Array.from(h).map(toHex32).join("");
      }

      // ---- SHA-384 & SHA-512 (BigInt) ----
      const MASK64 = 0xffffffffffffffffn;
      function rotr64(x, n) {
        return ((x >> n) | (x << (64n - n))) & MASK64;
      }

      const SHA512_K = [
        0x428a2f98d728ae22n, 0x7137449123ef65cdn, 0xb5c0fbcfec4d3b2fn, 0xe9b5dba58189dbbcn,
        0x3956c25bf348b538n, 0x59f111f1b605d019n, 0x923f82a4af194f9bn, 0xab1c5ed5da6d8118n,
        0xd807aa98a3030242n, 0x12835b0145706fben, 0x243185be4ee4b28cn, 0x550c7dc3d5ffb4e2n,
        0x72be5d74f27b896fn, 0x80deb1fe3b1696b1n, 0x9bdc06a725c71235n, 0xc19bf174cf692694n,
        0xe49b69c19ef14ad2n, 0xefbe4786384f25e3n, 0x0fc19dc68b8cd5b5n, 0x240ca1cc77ac9c65n,
        0x2de92c6f592b0275n, 0x4a7484aa6ea6e483n, 0x5cb0a9dcbd41fbd4n, 0x76f988da831153b5n,
        0x983e5152ee66dfabn, 0xa831c66d2db43210n, 0xb00327c898fb213fn, 0xbf597fc7beef0ee4n,
        0xc6e00bf33da88fc2n, 0xd5a79147930aa725n, 0x06ca6351e003826fn, 0x142929670a0e6e70n,
        0x27b70a8546d22ffcn, 0x2e1b21385c26c926n, 0x4d2c6dfc5ac42aedn, 0x53380d139d95b3dfn,
        0x650a73548baf63den, 0x766a0abb3c77b2a8n, 0x81c2c92e47edaee6n, 0x92722c851482353bn,
        0xa2bfe8a14cf10364n, 0xa81a664bbc423001n, 0xc24b8b70d0f89791n, 0xc76c51a30654be30n,
        0xd192e819d6ef5218n, 0xd69906245565a910n, 0xf40e35855771202an, 0x106aa07032bbd1b8n,
        0x19a4c116b8d2d0c8n, 0x1e376c085141ab53n, 0x2748774cdf8eeb99n, 0x34b0bcb5e19b48a8n,
        0x391c0cb3c5c95a63n, 0x4ed8aa4ae3418acbn, 0x5b9cca4f7763e373n, 0x682e6ff3d6b2b8a3n,
        0x748f82ee5defb2fcn, 0x78a5636f43172f60n, 0x84c87814a1f0ab72n, 0x8cc702081a6439ecn,
        0x90befffa23631e28n, 0xa4506cebde82bde9n, 0xbef9a3f7b2c67915n, 0xc67178f2e372532bn,
        0xca273eceea26619cn, 0xd186b8c721c0c207n, 0xeada7dd6cde0eb1en, 0xf57d4f7fee6ed178n,
        0x06f067aa72176fban, 0x0a637dc5a2c898a6n, 0x113f9804bef90daen, 0x1b710b35131c471bn,
        0x28db77f523047d84n, 0x32caab7b40c72493n, 0x3c9ebe0a15c9bebcn, 0x431d67c49c100d4cn,
        0x4cc5d4becb3e42b6n, 0x597f299cfc657e2an, 0x5fcb6fab3ad6faecn, 0x6c44198c4a475817n
      ];

      function sha512Family(str, is384) {
        const msg = utf8Bytes(str);
        const bitLen = BigInt(msg.length) * 8n;
        const paddedLen = Math.ceil((msg.length + 17) / 128) * 128;
        const buf = new Uint8Array(paddedLen);
        buf.set(msg);
        buf[msg.length] = 0x80;
        const view = new DataView(buf.buffer);
        view.setBigUint64(paddedLen - 16, bitLen >> 64n, false);
        view.setBigUint64(paddedLen - 8, bitLen & MASK64, false);

        const h = is384
          ? [
              0xcbbb9d5dc1059ed8n, 0x629a292a367cd507n, 0x9159015a3070dd17n, 0x152fecd8f70e5939n,
              0x67332667ffc00b31n, 0x8eb44a8768581511n, 0xdb0c2e0d64f98fa7n, 0x47b5481dbefa4fa4n
            ]
          : [
              0x6a09e667f3bcc908n, 0xbb67ae8584caa73bn, 0x3c6ef372fe94f82bn, 0xa54ff53a5f1d36f1n,
              0x510e527fade682d1n, 0x9b05688c2b3e6c1fn, 0x1f83d9abfb41bd6bn, 0x5be0cd19137e2179n
            ];

        const w = new Array(80);

        for (let offset = 0; offset < paddedLen; offset += 128) {
          for (let i = 0; i < 16; i++) {
            w[i] = view.getBigUint64(offset + i * 8, false);
          }
          for (let i = 16; i < 80; i++) {
            const s0 = rotr64(w[i - 15], 1n) ^ rotr64(w[i - 15], 8n) ^ (w[i - 15] >> 7n);
            const s1 = rotr64(w[i - 2], 19n) ^ rotr64(w[i - 2], 61n) ^ (w[i - 2] >> 6n);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) & MASK64;
          }

          let [a, b, c, d, e, f, g, hh] = h;
          for (let i = 0; i < 80; i++) {
            const S1 = rotr64(e, 14n) ^ rotr64(e, 18n) ^ rotr64(e, 41n);
            const ch = (e & f) ^ ((~e & MASK64) & g);
            const temp1 = (hh + S1 + ch + SHA512_K[i] + w[i]) & MASK64;
            const S0 = rotr64(a, 28n) ^ rotr64(a, 34n) ^ rotr64(a, 39n);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (S0 + maj) & MASK64;

            hh = g;
            g = f;
            f = e;
            e = (d + temp1) & MASK64;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) & MASK64;
          }

          h[0] = (h[0] + a) & MASK64;
          h[1] = (h[1] + b) & MASK64;
          h[2] = (h[2] + c) & MASK64;
          h[3] = (h[3] + d) & MASK64;
          h[4] = (h[4] + e) & MASK64;
          h[5] = (h[5] + f) & MASK64;
          h[6] = (h[6] + g) & MASK64;
          h[7] = (h[7] + hh) & MASK64;
        }

        const count = is384 ? 6 : 8;
        let out = "";
        for (let i = 0; i < count; i++) {
          out += h[i].toString(16).padStart(16, "0");
        }
        return out;
      }

      // ---- CRC32 ----
      const CRC32_TABLE = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) {
          c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        }
        CRC32_TABLE[i] = c >>> 0;
      }

      function crc32(str) {
        const bytes = utf8Bytes(str);
        let crc = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) {
          crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
        }
        return toHex32((crc ^ 0xffffffff) >>> 0);
      }

      // ---- Adler-32 ----
      function adler32(str) {
        const bytes = utf8Bytes(str);
        let a = 1, b = 0;
        const MOD = 65521;
        for (let i = 0; i < bytes.length; i++) {
          a = (a + bytes[i]) % MOD;
          b = (b + a) % MOD;
        }
        return toHex32(((b << 16) | a) >>> 0);
      }

      function computeHash(text, algo) {
        switch (algo) {
          case "sha1":    return sha1(text);
          case "md5":     return md5(text);
          case "sha256":  return sha256(text);
          case "sha384":  return sha512Family(text, true);
          case "sha512":  return sha512Family(text, false);
          case "crc32":   return crc32(text);
          case "adler32": return adler32(text);
          default:        return sha1(text);
        }
      }

      // ---- DOM Binding ----
      const form = document.getElementById("hashForm");
      const input = document.getElementById("textToHashId");
      const algoSelect = document.getElementById("hashAlgorithm");
      const resultContainer = document.getElementById("result-container");
      const resultAlgo = document.getElementById("result-algo");
      const resultSpan = document.getElementById("result-sha1");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = input.value;
        const algo = algoSelect.value;
        const hash = computeHash(text, algo);
        resultAlgo.textContent = algo;
        resultSpan.textContent = hash;
        resultContainer.classList.add("visible");
      });

      copyBtn.addEventListener("click", function () {
        const text = resultSpan.textContent;
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            copyBtn.textContent = "Copied!";
            setTimeout(function () { copyBtn.textContent = "Copy Hash"; }, 1200);
          });
        } else {
          const range = document.createRange();
          range.selectNodeContents(resultSpan);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand("copy");
          sel.removeAllRanges();
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy Hash"; }, 1200);
        }
      });

      clearBtn.addEventListener("click", function () {
        input.value = "";
        resultSpan.textContent = "";
        resultContainer.classList.remove("visible");
        input.focus();
      });
    })();
  </script>
</body>
</html>
